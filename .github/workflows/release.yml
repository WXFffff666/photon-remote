name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
          echo "Resolved tag: $(cat $GITHUB_OUTPUT)"

      - name: Validate tag format
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $TAG does not match v*.*.* (e.g. v1.0.1)"
            exit 1
          fi

      - name: Validate versionName matches tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION_NAME=$(grep -E 'versionName\s*=\s*"' app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          echo "versionName in app/build.gradle.kts: $VERSION_NAME"
          echo "tag: $TAG"
          EXPECTED="v$VERSION_NAME"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG != $EXPECTED (versionName $VERSION_NAME). Please bump versionName in app/build.gradle.kts or retag."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Inject signing keystore (if secrets present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 not set — release APK will use debug signing (not for distribution)"
            exit 0
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          # Decode to temp file
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/photon-remote.jks
          ls -lh /tmp/photon-remote.jks
          # Create keystore.properties at all candidate locations for compatibility with hard-coded D:/Android path
          cat > /tmp/keystore.properties <<EOF
          storeFile=/tmp/photon-remote.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          cat /tmp/keystore.properties | sed 's/storePassword=.*/storePassword=***/; s/keyPassword=.*/keyPassword=***/'
          # Candidate 1: hard-coded Windows path (create as relative inside workspace — Gradle file() will resolve relative to project)
          mkdir -p "D:/Android/keystore" 2>/dev/null || mkdir -p "$GITHUB_WORKSPACE/D:/Android/keystore"
          cp /tmp/keystore.properties "D:/Android/keystore/keystore.properties" 2>/dev/null || cp /tmp/keystore.properties "$GITHUB_WORKSPACE/D:/Android/keystore/keystore.properties" || true
          # Candidate 2: project root and app dir (for patched build logic)
          cp /tmp/keystore.properties ./keystore.properties
          cp /tmp/keystore.properties app/keystore.properties
          # Candidate 3: legacy absolute linux path
          sudo mkdir -p /tmp/keystore 2>/dev/null || true
          cp /tmp/keystore.properties /tmp/keystore/keystore.properties 2>/dev/null || true
          echo "Keystore injected to multiple candidates"

      - name: Unit tests (gate)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble Release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Assemble Debug (for release assets)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APKs
        run: |
          ls -lh app/build/outputs/apk/release/ || true
          ls -lh app/build/outputs/apk/debug/ || true
          test -f app/build/outputs/apk/release/PhotonRemote-release-v*.apk || (echo "Release APK not found" && ls -R app/build/outputs/apk/ && exit 1)
          test -f app/build/outputs/apk/debug/PhotonRemote-debug-v*.apk || (echo "Debug APK not found" && ls -R app/build/outputs/apk/ && exit 1)
          echo "APK verification passed"

      - name: Verify signing
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          if [ ! -f "$APKSIGNER" ]; then
            APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          fi
          echo "Using apksigner: $APKSIGNER"
          $APKSIGNER verify --verbose --print-certs app/build/outputs/apk/release/PhotonRemote-release-v*.apk || (echo "::warning::apksigner verify failed — check signing" && exit 1)
          # Ensure release is not using debug keystore (debug cert DN contains Android Debug)
          if $APKSIGNER verify --print-certs app/build/outputs/apk/release/PhotonRemote-release-v*.apk | grep -qi "Android Debug"; then
            echo "::warning::Release APK appears signed with debug key — did signing secrets missing?"
            if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
              echo "::error::Secrets were set but APK still debug-signed — fail"
              exit 1
            fi
          else
            echo "Release signing looks valid (not debug)"
          fi

      - name: Check tag not already released (idempotency)
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release $TAG already exists — will update assets"
          else
            echo "No existing release for $TAG — will create"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/PhotonRemote-release-v*.apk
            app/build/outputs/apk/debug/PhotonRemote-debug-v*.apk

      - name: Upload artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ steps.tag.outputs.tag }}
          path: |
            app/build/outputs/apk/release/PhotonRemote-*.apk
            app/build/outputs/apk/debug/PhotonRemote-*.apk
          retention-days: 30
